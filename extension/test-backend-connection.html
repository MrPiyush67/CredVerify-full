<!DOCTYPE html>
<html>

<head>
  <title>Test Backend Connection</title>
</head>

<body>
  <h1>Backend Connection Test</h1>
  <button onclick="testHealth()">Test Health Endpoint</button>
  <button onclick="testVerifyEndpoint()">Test Verify Endpoint (No Auth)</button>
  <button onclick="testWithToken()">Test With Token</button>
  <pre id="output"></pre>

  <script>
    const output = document.getElementById('output');

    async function testHealth() {
      output.textContent = 'Testing /health endpoint...\n';
      try {
        const res = await fetch('http://127.0.0.1:5000/health');
        const data = await res.json();
        output.textContent += `✅ Health check: ${res.status}\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        output.textContent += `❌ Error: ${err.message}`;
      }
    }

    async function testVerifyEndpoint() {
      output.textContent = 'Testing /api/credentials/verify-certificate...\n';
      try {
        const res = await fetch('http://127.0.0.1:5000/api/credentials/verify-certificate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageData: 'test',
            sourceUrl: 'https://test.com'
          })
        });
        const data = await res.json();
        output.textContent += `Status: ${res.status}\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        output.textContent += `❌ Error: ${err.message}`;
      }
    }

    async function testWithToken() {
      const token = prompt('Enter auth token:');
      output.textContent = 'Testing with authentication...\n';
      try {
        const res = await fetch('http://127.0.0.1:5000/api/credentials/verify-certificate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            imageData: 'dGVzdA==',
            sourceUrl: 'https://test.com'
          })
        });
        const data = await res.json();
        output.textContent += `Status: ${res.status}\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        output.textContent += `❌ Error: ${err.message}`;
      }
    }
  </script>
</body>

</html>
