<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - CredVerify Extension</title>
  <link rel="stylesheet" href="../css/popup.css" />
  <style>
    body {
      min-width: 400px;
      padding: 0;
      margin: 0;
    }

    .login-container {
      padding: 2rem;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: hsl(var(--primary));
    }

    .logo-subtitle {
      font-size: 0.875rem;
      color: hsl(var(--muted-foreground));
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: hsl(var(--foreground));
    }

    .form-input {
      padding: 0.75rem;
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      transition: all var(--transition-base);
    }

    .form-input:focus {
      outline: none;
      border-color: hsl(var(--primary));
      box-shadow: 0 0 0 4px hsl(var(--primary) / 0.1);
    }

    .form-input:disabled {
      background-color: hsl(var(--muted));
      cursor: not-allowed;
    }

    .login-button {
      margin-top: 1rem;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: hsl(var(--muted-foreground));
      font-size: 0.875rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid hsl(var(--border));
    }

    .divider::before {
      margin-right: 0.5rem;
    }

    .divider::after {
      margin-left: 0.5rem;
    }

    .signup-link {
      text-align: center;
      font-size: 0.875rem;
      color: hsl(var(--muted-foreground));
    }

    .signup-link a {
      color: hsl(var(--primary));
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      padding: 0.75rem;
      background-color: hsl(var(--destructive) / 0.1);
      border: 1px solid hsl(var(--destructive));
      border-radius: var(--radius-md);
      color: hsl(var(--destructive));
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .success-message {
      padding: 0.75rem;
      background-color: hsl(var(--success) / 0.1);
      border: 1px solid hsl(var(--success));
      border-radius: var(--radius-md);
      color: hsl(var(--success));
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">CredVerify</div>
      <div class="logo-subtitle">Certificate Verification Extension</div>
    </div>

    <!-- Alert Messages -->
    <div id="alertContainer"></div>

    <!-- Login Form -->
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email" required
          autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" required
          autocomplete="current-password" />
      </div>

      <button type="submit" class="button button-primary login-button">
        <span class="spinner" id="loginSpinner" style="display: none;"></span>
        <span id="loginBtnText">Login to CredVerify</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">or</div>

    <!-- Signup Link -->
    <div class="signup-link">
      Don't have an account?
      <a href="#" id="signupLink" target="_blank">Sign up on CredVerify</a>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>

</html>
